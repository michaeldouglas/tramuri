[package]
name = "tramuri-python"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "PyO3 bindings for Tramuri"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.30.1", features = ["extension-module", "abi3-py311"] }
serde_json = "1"
tramuri-core = { path = "../../crates/tramuri-core" }
